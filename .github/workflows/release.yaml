name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test-local:
    name: Run Local Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (uv + pytest)
        run: pip install uv pytest pytest-asyncio httpx pydantic fastmcp google-adk

      - name: Run unit & integration tests
        working-directory: math-agent
        run: |
          pytest tests/unit/ -v

  deploy-mcp:
    name: Deploy MCP to Cloud Run
    needs: test-local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: gcloud run deploy math-mcp
        run: |
          VERSION_LABEL=$(echo "${{ github.ref_name }}" | tr '[:upper:].' '[:lower:]-')
          gcloud run deploy math-mcp \
            --source math-mcp-server/ \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --no-allow-unauthenticated \
            --service-account "${{ vars.MCP_SA }}" \
            --set-env-vars "FASTMCP_CHECK_FOR_UPDATES=off,GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},MCP_SERVER_URN=${{ vars.MCP_SERVER_URN }},OTEL_SERVICE_NAME=math-mcp" \
            --labels "version=${VERSION_LABEL}" \
            --quiet

  deploy-agent:
    name: Deploy agent to Agent Runtime
    needs: test-local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (uv + agents-cli)
        run: pip install uv "google-agents-cli==1.2.1"

      - name: agents-cli deploy math-agent
        working-directory: math-agent
        run: |
          agents-cli deploy \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.AGENT_SA }}" \
            --update-env-vars "GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},GOOGLE_CLOUD_LOCATION=global,AGENT_REGISTRY_LOCATION=${{ vars.GCP_REGION }},MATH_MCP_SERVER_NAME=${{ vars.MCP_SERVER_NAME }},MODEL_ARMOR_TEMPLATE=${{ vars.MODEL_ARMOR_TEMPLATE }},AGENT_VERSION=${{ github.ref_name }}" \
            --no-confirm-project

  test-remote:
    name: Run Remote Tests on Google Cloud Agent Platform
    needs: [deploy-mcp, deploy-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install uv pytest pytest-asyncio httpx google-cloud-aiplatform google-auth

      - name: Run Remote Integration Tests against Deployed Agent Platform
        working-directory: math-agent
        run: |
          pytest tests/remote/ \
            -v \
            -m remote
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GCP_REGION }}
