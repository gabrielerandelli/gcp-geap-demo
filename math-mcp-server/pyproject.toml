[project]
name = "math-mcp-server"
version = "0.1.0"
description = "FastMCP server exposing basic arithmetic tools for the GEAP math-agent demo."
requires-python = ">=3.11"
dependencies = [
    "fastmcp~=3.4",
    "opentelemetry-sdk~=1.44",
    "opentelemetry-exporter-gcp-trace~=1.12",
    "opentelemetry-instrumentation-starlette>=0.65b0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]

# The GCP Cloud Trace exporter transitively requires an unreleased version of
# opentelemetry-resourcedetector-gcp; allow pre-releases so uv can resolve it.
[tool.uv]
prerelease = "allow"
