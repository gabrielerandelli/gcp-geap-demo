[project]
name = "math-mcp-server"
version = "0.1.0"
description = "FastMCP server exposing basic arithmetic tools for the GEAP math-agent demo."
requires-python = ">=3.11"
dependencies = [
    "fastmcp~=3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]
